[project]
name = "synthetic-user-lab"
version = "0.1.0"
description = "A research harness that runs panels of LLM-simulated users against product artefacts."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.122.0",
    "google-genai>=2.18.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.1",
]

[project.scripts]
sul = "sul.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sul"]

[tool.ruff]
line-length = 88
target-version = "py312"
# Ruff formats fenced Python blocks in Markdown by default; scope it to actual
# source so it never rewrites PROJECT_SPEC.md, README.md, or CLAUDE.md.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `typer.Option`/`typer.Argument` calls in a signature default are the
# documented Typer pattern (`sul report`'s CLI options, M5) -- immutable,
# constructed once at import time, not the mutable-default footgun B008
# exists to catch.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: tests that take longer than normal to run",
    "llm: would require a live provider call; must never actually run one — use FakeProvider instead",
    "integration: exercises multiple components together",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "sul.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# scikit-learn ships no type stubs (PROJECT_SPEC.md §M5 deviation). Scoped to
# this one module, not a global relaxation.
module = "sklearn.*"
ignore_missing_imports = true
