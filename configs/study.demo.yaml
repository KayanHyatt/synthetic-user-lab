# `sul demo` / `make demo`'s own study configuration (PROJECT_SPEC.md §M7).
# Not an "example" -- `sul demo` reads this file directly, every time.
# Against `artefacts/bad_onboarding.html` deliberately: it carries the same
# seeded defects §M6's discriminative-validity and known-answer-calibration
# checks use, so the demo's report is never empty and always has something
# concrete to show a reviewer with no API key.
name: "Demo: bad onboarding usability study"
research_goal: >-
  Determine whether new users can sign up for the free trial without getting
  stuck on unclear required fields or pricing that doesn't match what the
  page promised.

artefact:
  name: bad_onboarding.html
  kind: html
  path: artefacts/bad_onboarding.html

scenario:
  task: >-
    You've just landed on this page for the first time, looking to try the
    product out. Go ahead and sign up for the free trial.
  questions:
    - "Was the pricing clear, or did anything about the price surprise you?"
    - "Was there a point where you weren't sure what a field wanted from you?"
    - "Did everything on the page do what you expected when you clicked it?"

panel_config_path: configs/panel.demo.yaml

# Unbounded: `sul demo` only ever runs against FakeProvider (never real
# spend), and `Settings.max_cost_usd`'s own docstring names this exact case
# as the one where `None` is appropriate. A nonzero ceiling here would be
# misleading -- it would read as "a real budget", not "there is no spend to
# bound".
budget: {}

runner:
  provider: fake
  model: fake-1
  temperature: 0.7
  max_tokens: 400
  concurrency: 1
  max_followups: 3
